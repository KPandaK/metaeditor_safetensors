name: CI

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]

permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v3
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      
      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --with dev
      
      - name: Check Code Quality
        uses: astral-sh/ruff-action@v3
        with:
          src: "."
          args: "check --output-format=github"
      
      - name: Verify Code Formatting
        uses: astral-sh/ruff-action@v3
        with:
          src: "."
          args: "format --check --diff"
      
      - name: Check Types with mypy
        run: poetry run mypy .

  test-linux:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      
      - name: Load cached venv
        id: cached-poetry-dependencies-linux
        uses: actions/cache@v3
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          libegl1 \
          libegl-mesa0 \
          libxkbcommon-x11-0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-xinerama0 \
          libfontconfig1 \
          libxrender1 \
          libxss1 \
          libglib2.0-0 \
          xvfb
      
      - name: Install dependencies
        if: steps.cached-poetry-dependencies-linux.outputs.cache-hit != 'true'
        run: poetry install --with dev
      
      - name: Run tests with coverage
        run: |
          xvfb-run -a poetry run pytest --cov=metaeditor_safetensors --cov-report=term-missing -v
          poetry run coverage html
        env:
          QT_QPA_PLATFORM: offscreen
      
      - name: Coverage Comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-other:
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      
      - name: Load cached venv
        id: cached-poetry-dependencies-other
        uses: actions/cache@v3
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
      
      - name: Install dependencies
        if: steps.cached-poetry-dependencies-other.outputs.cache-hit != 'true'
        run: poetry install --with dev
      
      - name: Run tests
        run: poetry run pytest -v --tb=short
        env:
          QT_QPA_PLATFORM: offscreen
