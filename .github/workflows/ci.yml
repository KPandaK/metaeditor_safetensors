name: CI

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]

permissions:
  contents: write
  pull-requests: write

jobs:
  # This job combines linting and testing on Linux to improve efficiency.
  lint-and-test-linux:
    name: Lint & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      # Define reusable steps using YAML anchors on their first use.
      - &checkout
        name: Check out repository
        uses: actions/checkout@v4

      - &setup-python
        name: Set up Python 3.11
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - &install-poetry
        name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      
      - &cache-dependencies
        name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          # The cache key includes the OS, Python version, and a hash of the lock file.
          # A new cache is created only when the lock file changes.
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      
      - &install-dependencies
        name: Install dependencies
        # This step only runs if the cache was not restored.
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --with dev

      - name: Check Code Quality
        run: poetry run ruff check --output-format=github .

      - name: Verify Code Formatting
        run: poetry run ruff format --check --diff .
      
      - name: Check Types with mypy
        run: poetry run mypy .

      - name: Install system dependencies for GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libegl-mesa0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libfontconfig1 \
            libxrender1 \
            libxss1 \
            libglib2.0-0 \
            xvfb
      
      - name: Run tests with coverage
        run: |
          xvfb-run -a poetry run pytest --cov=metaeditor_safetensors --cov-report=term-missing -v
          poetry run coverage html
        env:
          # Use an offscreen Qt platform for tests in a headless environment.
          QT_QPA_PLATFORM: offscreen
      
      - name: Post Coverage Comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # This job runs tests on macOS and Windows across multiple Python versions.
  test-other-platforms:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    needs: lint-and-test-linux
    runs-on: ${{ matrix.os }}
    strategy:
      # Prevent all other jobs in the matrix from being cancelled if one fails.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # Reuse the steps defined in the previous job.
      - *checkout
      
      # The setup-python step for the matrix needs to be slightly different,
      # so we redefine it here instead of using the anchor.
      - name: Set up Python ${{ matrix.python-version }}
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - *install-poetry
      
      # Explicitly define the cache step to avoid linter warnings with YAML anchors.
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      
      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        shell: bash
        run: poetry install --no-interaction --with dev
      
      - name: Run tests
        shell: bash
        run: poetry run pytest -v --tb=short
        env:
          QT_QPA_PLATFORM: offscreen

