name: Security Scan

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6 AM UTC
  workflow_dispatch:  # Manual trigger

permissions:
  contents: read
  security-events: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      
      - name: Load cached venv
        id: cached-poetry-dependencies-security
        uses: actions/cache@v3
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
      
      - name: Install dependencies
        if: steps.cached-poetry-dependencies-security.outputs.cache-hit != 'true'
        run: poetry install --with dev
      
      - name: Security Scan
        run: |
          poetry run bandit -r metaeditor_safetensors -f json -o bandit-report.json || true
          echo "Bandit security scan completed"
      
      - name: Audit Dependencies
        run: |
          poetry export -f requirements.txt --without-hashes > requirements.txt
          poetry run pip install pip-audit
          poetry run pip-audit -r requirements.txt
